name: Project checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docs_assistant_test
          POSTGRES_USER: docs_assistant
          POSTGRES_PASSWORD: docs_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs_assistant -d docs_assistant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docs_assistant:docs_assistant_test@localhost:5432/docs_assistant_test
      TEST_DATABASE_URL: postgresql+psycopg://docs_assistant:docs_assistant_test@localhost:5432/docs_assistant_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

name: Project checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+psycopg://docs_assistant:docs_assistant_test@localhost:5432/docs_assistant_test
      TEST_DATABASE_URL: postgresql+psycopg://docs_assistant:docs_assistant_test@localhost:5432/docs_assistant_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL pgvector
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-16-pgvector
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql --command "CREATE ROLE docs_assistant WITH LOGIN PASSWORD 'docs_assistant_test';"
          sudo -u postgres createdb --owner=docs_assistant docs_assistant_test
          sudo -u postgres psql --dbname=docs_assistant_test --command "CREATE EXTENSION vector;"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

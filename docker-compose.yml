services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-docs_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define una contraseña local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docs_assistant} -d ${POSTGRES_DB:-docs_assistant}"]
      interval: 5s
      timeout: 3s
      retries: 10
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docs_assistant_test
      POSTGRES_USER: ${POSTGRES_USER:-docs_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define una contraseña local}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docs_assistant} -d docs_assistant_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
